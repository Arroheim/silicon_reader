name: Release

# Pushing a v* tag (make release VERSION=x.y.z, then git push origin vx.y.z)
# builds, tests and publishes a GitHub release with the DMG attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # build number = commit count

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release notes (fails if CHANGELOG has no section for this version)
        run: |
          mkdir -p build
          scripts/release-notes.sh "${{ steps.version.outputs.version }}" > build/release-notes.md

      - name: Resolve MuPDF revision
        id: mupdf
        run: echo "rev=$(git rev-parse HEAD:Vendor/mupdf)" >> "$GITHUB_OUTPUT"

      - name: Cache MuPDF build
        uses: actions/cache@v4
        with:
          path: build/deps/mupdf
          key: mupdf-${{ runner.os }}-${{ runner.arch }}-${{ steps.mupdf.outputs.rev }}-${{ hashFiles('Makefile') }}

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: End-to-end tests
        run: make e2e VERSION="${{ steps.version.outputs.version }}"

      - name: Build DMG
        run: make dmg VERSION="${{ steps.version.outputs.version }}"

      # A tarball keeps the executable bit and the signature for the macOS 14 job.
      - name: Pack the app
        run: tar -czf build/SiliconReader.app.tgz -C build SiliconReader.app

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/SiliconReader-${{ steps.version.outputs.version }}.dmg
            build/SiliconReader-${{ steps.version.outputs.version }}.dmg.sha256
            build/SiliconReader.app.tgz
            build/release-notes.md

  # Run the very app that goes into the DMG on the oldest macOS it supports.
  macos-14:
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The image defaults to Xcode 15 (Swift 5.10); the tests need Swift 6.
      # Only the tests are built here: the app comes from the release job.
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          sw_vers
          swift --version

      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release
          path: build

      - name: Unpack the app
        run: tar -xzf build/SiliconReader.app.tgz -C build

      # The e2e tests link ReaderCore, which needs MuPDF.
      - name: Build MuPDF
        run: make deps

      - name: Smoke test on macOS 14
        run: make smoke-prebuilt

      - name: End-to-end tests on macOS 14
        run: make e2e-prebuilt

  publish:
    needs: macos-14
    runs-on: ubuntu-latest
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release
          path: build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/SiliconReader-${version}.dmg" \
            "build/SiliconReader-${version}.dmg.sha256" \
            --title "Silicon Reader ${version}" \
            --notes-file build/release-notes.md
